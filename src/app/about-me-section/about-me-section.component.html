<div class="abot-me-section" id="aboutMeSection">
  <div class="about-me-child">
    <div class="about-me-top">
      <img src="assets/profil/profil2.png" alt=""/>
      <div class="about-me-text">
        <h2>About me.</h2>
        <span
        >I'm a software developer with a background in automotive. I like to understand a system all the way down before I change it.</span
        >
      </div>
    </div>
    <div class="thats-me">
      <div *ngFor="let step of steps" class="my-steps">
        <div class="img-background">
          <img src="{{ step.imgPath }}" alt="" />
        </div>
        <h3 class="head">{{ step.head }}</h3>
        <p class="step-description">{{ step.description }}</p>
      </div>
    </div>
  </div>
</div>
